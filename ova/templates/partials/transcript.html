{% if transcript %}
  <details class="transcript">
    <summary class="button tertiary"><span>Transcript</span></summary>
    <article>
      {% for paragraph in transcript %}
        <p>
          {% for phrase in paragraph %}<span data-timestamp="{{ phrase.timestamp }}">{{ phrase.text }}</span>{% if not forloop.last %} {% endif %}
          {% endfor %}
        </p>
      {% endfor %}
    </article>
  </details>
{% endif %}
